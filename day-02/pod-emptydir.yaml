apiVersion: v1
kind: Pod
metadata:
  labels:
    run: gli-2
  name: gli-2
spec:
  containers:
  - image: nginx
    name: webserver
    volumeMounts:
    - mountPath: /glipops
      name: primeiro-emptydir
    resources:
      limits:
        cpu: "0.5"
        memory: "128Mi"
      requests:
        cpu: "0.3"
        memory: "64Mi"
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  volumes:
  - name: primeiro-emptydir
    emptyDir:
      sizeLimit: 256Mi
